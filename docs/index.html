    <!-- Smart Static Hosting Bootloader: Ensures the app starts immediately on GitHub Pages -->
    <script>
      (function() {
        var hasBooted = false;
        function loadFallbackBundle() {
          if (hasBooted || window.__APP_BOOTED__) return;
          var root = document.getElementById('root');
          if (root && root.querySelector('.initial-static-loader')) {
            hasBooted = true;
            window.__APP_BOOTED__ = true;
            console.log('Static host mode: bootstrapping precompiled bundle...');
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = './assets/app.js';
            document.head.appendChild(s);

            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.crossOrigin = 'anonymous';
            l.href = './assets/app.css';
            document.head.appendChild(l);
          }
        }

        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('main.tsx') !== -1) {
            loadFallbackBundle();
          }
        }, true);

        // If running directly on GitHub Pages or static host where main.tsx cannot compile
        if (window.location.hostname.indexOf('github.io') !== -1) {
          setTimeout(loadFallbackBundle, 100);
        } else {
          setTimeout(loadFallbackBundle, 600);
        }
      })();
    </script>
